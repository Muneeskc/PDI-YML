<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxon TATA - Yard Management System</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e40af; --primary-light: #2563eb; --primary-bg: #eff6ff;
            --success: #059669; --success-bg: #ecfdf5; --warning: #d97706; --warning-bg: #fffbeb;
            --danger: #dc2626; --danger-bg: #fef2f2; --dark: #0f172a; --slate: #475569;
            --light: #f1f5f9; --white: #ffffff; --border: #cbd5e1; --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--light); color: var(--dark); padding-bottom: 70px; }

        .app-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: var(--white); padding: 12px 16px;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand-box { display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 36px; height: 36px; background: var(--primary-light); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; }
        .brand-title { font-size: 15px; font-weight: 800; }
        .brand-sub { font-size: 11px; color: #93c5fd; }

        .menu-container { position: relative; }
        .menu-btn { background: rgba(255,255,255,0.15); color: white; border: none; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .menu-dropdown { position: absolute; right: 0; top: 40px; background: white; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); width: 200px; display: none; z-index: 1000; overflow: hidden; border: 1px solid var(--border); }
        .menu-dropdown.show { display: block; }
        .menu-item { padding: 11px 14px; font-size: 13px; font-weight: 700; color: var(--dark); border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .menu-item:hover { background: var(--primary-bg); color: var(--primary); }

        .nav-tabs {
            background: var(--white); display: flex; overflow-x: auto; gap: 6px; padding: 8px 12px;
            border-bottom: 1px solid var(--border); position: sticky; top: 58px; z-index: 90;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            border: 1px solid var(--border); background: var(--white); color: var(--slate);
            padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .tab-btn.active { background: var(--primary-light); color: var(--white); border-color: var(--primary-light); }

        .container { max-width: 900px; margin: 0 auto; padding: 12px; }
        .module-section { display: none; }
        .module-section.active { display: block; }

        .card { background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; border: 1px solid #e2e8f0; }
        .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; }
        .card-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
        @media(min-width: 600px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
        .stat-card { background: var(--white); padding: 10px; border-radius: 10px; border: 2px solid #e2e8f0; text-align: center; cursor: pointer; }
        .stat-card.active-filter { border-color: var(--primary-light); background: var(--primary-bg); }
        .stat-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--slate); }
        .stat-val { font-size: 20px; font-weight: 800; margin-top: 2px; }

        .form-group { margin-bottom: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
        @media(min-width: 500px) { .form-row { grid-template-columns: 1fr 1fr; } }

        label { display: block; font-size: 11px; font-weight: 800; color: #1e293b; text-transform: uppercase; margin-bottom: 4px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: #fff; }
        input:focus, select:focus { border-color: var(--primary-light); }
        .mono-input { font-family: monospace; font-weight: 800; text-transform: uppercase; }

        .btn { border: none; padding: 9px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-full { width: 100%; padding: 12px; font-size: 13px; }
        .btn-primary { background: var(--primary-light); color: var(--white); }
        .btn-success { background: var(--success); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-outline { background: var(--white); color: var(--dark); border: 1px solid var(--border); }

        .badge { display: inline-block; padding: 3px 6px; border-radius: 12px; font-size: 10px; font-weight: 700; }
        .badge-pending { background: var(--warning-bg); color: var(--warning); border: 1px solid #fde68a; }
        .badge-ok { background: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }
        .badge-hold { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }
        .badge-conf { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }

        .vehicle-list { display: flex; flex-direction: column; gap: 8px; }
        .vehicle-item { border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 10px; background: var(--white); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .vehicle-item.selected-item { border-color: var(--primary-light); background: #eff6ff; }
        .v-info { flex: 1; cursor: pointer; }
        .v-info h4 { font-family: monospace; font-size: 14px; font-weight: 800; color: var(--primary); }
        .v-info p { font-size: 11px; color: var(--slate); margin-top: 2px; }

        .selected-banner { background: #ecfdf5; border: 1.5px solid var(--success); border-radius: 10px; padding: 10px; margin-bottom: 12px; display: none; }

        .scanner-viewport { width: 100%; max-width: 320px; margin: 0 auto 10px auto; border-radius: 8px; overflow: hidden; display: none; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 200; display: none; align-items: center; justify-content: center; padding: 12px; }
        .modal-card { background: var(--white); width: 100%; max-width: 500px; border-radius: 12px; padding: 16px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-box">
            <div class="brand-icon"><i class="fa-solid fa-warehouse"></i></div>
            <div>
                <div class="brand-title">LUXON TATA YMS</div>
                <div class="brand-sub" id="sync-sub">Ready</div>
            </div>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
            <button class="btn btn-outline" style="padding:5px 8px; font-size:11px; background:rgba(255,255,255,0.15); color:white; border:none;" onclick="syncSheet()">
                <i class="fa-solid fa-rotate" id="sync-icon"></i> Sync
            </button>
            <div class="menu-container">
                <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
                <div class="menu-dropdown" id="app-dropdown">
                    <div class="menu-item" onclick="openReportModal('daily')"><i class="fa-solid fa-calendar-day"></i> Daily Reports</div>
                    <div class="menu-item" onclick="openReportModal('hold')"><i class="fa-solid fa-triangle-exclamation"></i> Hold Reports</div>
                    <div class="menu-item" onclick="openSettingsModal()"><i class="fa-solid fa-gear"></i> Settings</div>
                </div>
            </div>
        </div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" id="tab-dashboard" onclick="openTab('dashboard')"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
        <button class="tab-btn" id="tab-inward" onclick="openTab('inward')"><i class="fa-solid fa-barcode"></i> 1. Inward</button>
        <button class="tab-btn" id="tab-pdi" onclick="openTab('pdi')"><i class="fa-solid fa-clipboard-check"></i> 2. PDI</button>
        <button class="tab-btn" id="tab-operations" onclick="openTab('operations')"><i class="fa-solid fa-truck-arrow-right"></i> 3. Operations</button>
    </nav>

    <div class="container">
        <!-- DASHBOARD -->
        <section id="mod-dashboard" class="module-section active">
            <div class="stats-grid">
                <div class="stat-card" id="card-physical" onclick="setDashFilter('Physical')">
                    <div class="stat-label">Physical Stock</div>
                    <div class="stat-val" id="cnt-physical" style="color:var(--primary);">0</div>
                </div>
                <div class="stat-card" id="card-pending" onclick="setDashFilter('Pending PDI')">
                    <div class="stat-label">Pending PDI</div>
                    <div class="stat-val" id="cnt-pending" style="color:var(--warning);">0</div>
                </div>
                <div class="stat-card" id="card-pdiok" onclick="setDashFilter('PDI OK')">
                    <div class="stat-label">PDI Done</div>
                    <div class="stat-val" id="cnt-pdiok" style="color:var(--success);">0</div>
                </div>
                <div class="stat-card" id="card-hold" onclick="setDashFilter('HOLD')">
                    <div class="stat-label">On Hold</div>
                    <div class="stat-val" id="cnt-hold" style="color:var(--danger);">0</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title" id="dash-title">All Sheet Vehicles</div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn btn-outline" id="btn-show-all" style="display:none; padding:4px 8px; font-size:11px;" onclick="setDashFilter('ALL')">Show All</button>
                        <button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="downloadCSV()"><i class="fa-solid fa-file-excel"></i> Export</button>
                    </div>
                </div>
                <div style="margin-bottom:10px;">
                    <input type="text" id="dash-search" placeholder="Search Chassis / Model..." oninput="renderDashList()">
                </div>
                <div id="dash-list" class="vehicle-list"></div>
            </div>
        </section>

        <!-- INWARD -->
        <section id="mod-inward" class="module-section">
            <div class="card">
                <div class="card-header"><div class="card-title"><i class="fa-solid fa-barcode"></i> Vehicle Inward</div></div>
                <div class="form-group">
                    <label>Chassis Number *</label>
                    <input type="text" id="in-chassis" class="mono-input" placeholder="Type Chassis Number...">
                </div>
                <div class="form-row">
                    <div>
                        <label>Vehicle Model *</label>
                        <input type="text" id="in-model" placeholder="Model (e.g. Tata Punch)">
                    </div>
                    <div>
                        <label>Yard Location *</label>
                        <select id="in-location"></select>
                    </div>
                </div>
                <button class="btn btn-primary btn-full" onclick="saveInward()"><i class="fa-solid fa-check"></i> Complete Inward</button>
            </div>
        </section>

        <!-- PDI -->
        <section id="mod-pdi" class="module-section">
            <div class="card">
                <div class="card-header"><div class="card-title"><i class="fa-solid fa-clipboard-check"></i> PDI Checking</div></div>
                <div style="margin-bottom:10px;">
                    <select id="pdi-dropdown" onchange="pickPdi(this.value)">
                        <option value="">-- Choose Vehicle for PDI --</option>
                    </select>
                </div>

                <div id="pdi-selected-box" class="selected-banner">
                    <div style="font-size:11px; font-weight:800; color:var(--success);">SELECTED VEHICLE:</div>
                    <div id="pdi-sel-chassis" style="font-family:monospace; font-weight:800; font-size:15px;"></div>
                    <div id="pdi-sel-sub" style="font-size:12px; color:var(--slate);"></div>
                </div>

                <div class="form-row">
                    <div>
                        <label>Odometer (KM) *</label>
                        <input type="text" id="pdi-odo" placeholder="e.g. 15 km">
                    </div>
                    <div>
                        <label>Technician / Inspector</label>
                        <select id="pdi-inspector"></select>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>PDI Status *</label>
                        <select id="pdi-status" onchange="toggleRemarksBox()">
                            <option value="PDI OK">PDI OK</option>
                            <option value="HOLD">PDI Hold</option>
                            <option value="REVIEW_PENDING">Send to Review</option>
                        </select>
                    </div>
                    <div id="pdi-rem-box" style="display:none;">
                        <label>Remarks / Hold Reason *</label>
                        <input type="text" id="pdi-remarks" placeholder="Enter reason...">
                    </div>
                </div>
                <button class="btn btn-success btn-full" onclick="savePdi()"><i class="fa-solid fa-check"></i> Submit PDI</button>
            </div>
        </section>

        <!-- OPERATIONS -->
        <section id="mod-operations" class="module-section">
            <div class="card">
                <div class="card-header"><div class="card-title"><i class="fa-solid fa-truck-arrow-right"></i> Yard Operations</div></div>
                <div style="margin-bottom:10px;">
                    <select id="op-dropdown" onchange="pickOp(this.value)">
                        <option value="">-- Choose Physical Stock Vehicle --</option>
                    </select>
                </div>

                <div id="op-selected-box" class="selected-banner" style="background:#eff6ff; border-color:var(--primary-light);">
                    <div style="font-size:11px; font-weight:800; color:var(--primary);">SELECTED VEHICLE:</div>
                    <div id="op-sel-chassis" style="font-family:monospace; font-weight:800; font-size:15px;"></div>
                    <div id="op-sel-sub" style="font-size:12px; color:var(--slate);"></div>
                </div>

                <div class="form-row">
                    <div>
                        <label>Action Type *</label>
                        <select id="op-action" onchange="toggleOpUI()">
                            <option value="LOCATION">Update Location</option>
                            <option value="DISPATCH">Delivery (Outward)</option>
                            <option value="TRANSFER">Stock Transfer (Regional)</option>
                        </select>
                    </div>
                    <div id="op-box-loc">
                        <label>New Location *</label>
                        <select id="op-newloc"></select>
                    </div>
                    <div id="op-box-dest" style="display:none;">
                        <label>Delivery Showroom *</label>
                        <select id="op-dest">
                            <option value="Malappuram">Malappuram</option>
                            <option value="Kottakkal">Kottakkal</option>
                            <option value="Edappal">Edappal</option>
                            <option value="Changanakkulam">Changanakkulam</option>
                            <option value="Kondotty">Kondotty</option>
                            <option value="Areekode">Areekode</option>
                        </select>
                    </div>
                    <div id="op-box-region" style="display:none;">
                        <label>Transfer Destination *</label>
                        <select id="op-region">
                            <option value="Ernakulam">Ernakulam</option>
                            <option value="Kollam">Kollam</option>
                            <option value="Trivandrum">Trivandrum</option>
                            <option value="Pathanamthitta - Konni">Pathanamthitta - Konni</option>
                            <option value="Dealer Yard">Dealer Yard</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary btn-full" onclick="saveOp()"><i class="fa-solid fa-check"></i> Update Operations</button>
            </div>
        </section>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <div class="card-header">
                <div class="card-title">Settings</div>
                <button class="btn btn-outline" style="padding:2px 6px;" onclick="closeModals()">✕</button>
            </div>
            <div class="form-group">
                <label>Google Apps Script URL</label>
                <input type="text" id="cfg-url">
            </div>
            <button class="btn btn-primary btn-full" onclick="saveConfig()">Save & Sync</button>
        </div>
    </div>

    <script>
        const LOCATIONS = [
            "Kottakkal Yard", "Changanakkal Yard", "Malappuram Yard",
            "Kottakkal Display", "Malappuram Display", "Edappal Display",
            "Changanakkulam Display", "Kondotty Display", "Areekode Display", "Body Shop"
        ];
        const INSPECTORS = ["Munees KC", "Sahal", "Safuvan", "Sarfas"];

        let vehicles = JSON.parse(localStorage.getItem('luxon_cars')) || [];
        let config = JSON.parse(localStorage.getItem('luxon_cfg')) || {
            url: 'https://script.google.com/macros/s/AKfycbyhtIDnBmd4yvJNYd60CpUqs5klkdwu97O8svx6PffXlmbmI8KuyZnDulPFALoAuUTdvQ/exec'
        };

        let currentFilter = 'ALL';
        let selPdi = '';
        let selOp = '';

        function clean(val) {
            return String(val || '').trim();
        }

        function isPhysical(v) {
            const loc = clean(v.location).toUpperCase();
            const st = clean(v.status).toUpperCase();
            if (st === 'OUTWARD' || st === 'STOCK TRANSFER') return false;
            if (loc.includes('OUTWARD') || loc.includes('TRANSFER')) return false;
            const exCities = ['ERNAKULAM', 'KOLLAM', 'TRIVANDRUM', 'PATHANAMTHITTA', 'KONNI', 'DEALER YARD'];
            if (exCities.some(c => loc.includes(c))) return false;
            return true;
        }

        window.onload = function() {
            initSelects();
            renderDashList();
            syncSheet();
        };

        function initSelects() {
            const locOptions = LOCATIONS.map(l => `<option value="${l}">${l}</option>`).join('');
            document.getElementById('in-location').innerHTML = locOptions;
            document.getElementById('op-newloc').innerHTML = locOptions;

            const insOptions = INSPECTORS.map(i => `<option value="${i}">${i}</option>`).join('');
            document.getElementById('pdi-inspector').innerHTML = insOptions;
        }

        function toggleMenu() {
            document.getElementById('app-dropdown').classList.toggle('show');
        }
        window.onclick = function(e) {
            if (!e.target.closest('.menu-container')) {
                document.getElementById('app-dropdown').classList.remove('show');
            }
        };

        function openTab(tab) {
            ['dashboard', 'inward', 'pdi', 'operations'].forEach(t => {
                document.getElementById('mod-' + t).classList.remove('active');
                document.getElementById('tab-' + t).classList.remove('active');
            });
            document.getElementById('mod-' + tab).classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');

            if (tab === 'dashboard') renderDashList();
            if (tab === 'pdi') updatePdiDropdown();
            if (tab === 'operations') updateOpDropdown();
        }

        function setDashFilter(filter) {
            currentFilter = (currentFilter === filter && filter !== 'ALL') ? 'ALL' : filter;
            renderDashList();
        }

        function renderDashList() {
            const phys = vehicles.filter(v => isPhysical(v));
            const pend = vehicles.filter(v => clean(v.status) === 'Pending PDI');
            const done = vehicles.filter(v => clean(v.status) === 'PDI OK');
            const hold = vehicles.filter(v => clean(v.status) === 'HOLD' || clean(v.status) === 'REVIEW_PENDING');

            document.getElementById('cnt-physical').innerText = phys.length;
            document.getElementById('cnt-pending').innerText = pend.length;
            document.getElementById('cnt-pdiok').innerText = done.length;
            document.getElementById('cnt-hold').innerText = hold.length;

            ['physical', 'pending', 'pdiok', 'hold'].forEach(id => document.getElementById('card-' + id).classList.remove('active-filter'));
            if (currentFilter === 'Physical') document.getElementById('card-physical').classList.add('active-filter');
            if (currentFilter === 'Pending PDI') document.getElementById('card-pending').classList.add('active-filter');
            if (currentFilter === 'PDI OK') document.getElementById('card-pdiok').classList.add('active-filter');
            if (currentFilter === 'HOLD') document.getElementById('card-hold').classList.add('active-filter');

            document.getElementById('btn-show-all').style.display = currentFilter === 'ALL' ? 'none' : 'inline-block';

            let list = vehicles;
            let title = `All Sheet Vehicles (${vehicles.length})`;

            if (currentFilter === 'Physical') { list = phys; title = `Physical Stock (${phys.length})`; }
            else if (currentFilter === 'Pending PDI') { list = pend; title = `Pending PDI (${pend.length})`; }
            else if (currentFilter === 'PDI OK') { list = done; title = `PDI Done (${done.length})`; }
            else if (currentFilter === 'HOLD') { list = hold; title = `On Hold (${hold.length})`; }

            document.getElementById('dash-title').innerText = title;

            const q = clean(document.getElementById('dash-search').value).toUpperCase();
            if (q) {
                list = list.filter(v => clean(v.chassis).toUpperCase().includes(q) || clean(v.model).toUpperCase().includes(q));
            }

            const box = document.getElementById('dash-list');
            if (!list.length) {
                box.innerHTML = `<div style="text-align:center; padding:16px; color:var(--slate);">No vehicles found.</div>`;
                return;
            }

            box.innerHTML = list.map(v => {
                const st = clean(v.status) || 'Pending PDI';
                const badge = st === 'PDI OK' ? 'badge-ok' : (st === 'HOLD' ? 'badge-hold' : (st === 'REVIEW_PENDING' ? 'badge-conf' : 'badge-pending'));
                return `
                <div class="vehicle-item">
                    <div class="v-info" onclick="quickSelectPdi('${v.chassis}')">
                        <h4>${v.chassis}</h4>
                        <p><b>${v.model || 'Tata Vehicle'}</b> • <i class="fa-solid fa-location-dot"></i> ${v.location || 'Yard'}</p>
                        ${v.remarks ? `<p style="color:var(--danger); font-weight:700;">Remarks: ${v.remarks}</p>` : ''}
                    </div>
                    <div>
                        <span class="badge ${badge}">${st}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function syncSheet() {
            if (!config.url) return;
            const icon = document.getElementById('sync-icon');
            if (icon) icon.classList.add('fa-spin');

            fetch(config.url + '?t=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        vehicles = data.map(row => ({
                            chassis: clean(row.chassis || row.Chassis),
                            model: clean(row.model || row.Model),
                            location: clean(row.location || row.Location),
                            status: clean(row.status || row.Status) || 'Pending PDI',
                            remarks: clean(row.remarks || row.Remarks),
                            inspector: clean(row.inspector || row.Inspector)
                        })).filter(v => v.chassis);
                        localStorage.setItem('luxon_cars', JSON.stringify(vehicles));
                    }
                    if (icon) icon.classList.remove('fa-spin');
                    document.getElementById('sync-sub').innerText = 'Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    renderDashList();
                    updatePdiDropdown();
                    updateOpDropdown();
                })
                .catch(() => {
                    if (icon) icon.classList.remove('fa-spin');
                    document.getElementById('sync-sub').innerText = 'Offline Mode';
                });
        }

        // PDI
        function updatePdiDropdown() {
            const drop = document.getElementById('pdi-dropdown');
            const phys = vehicles.filter(v => isPhysical(v));
            drop.innerHTML = `<option value="">-- Choose Vehicle for PDI (${phys.length} available) --</option>` +
                phys.map(v => `<option value="${v.chassis}" ${v.chassis===selPdi?'selected':''}>${v.chassis} - ${v.model} (${v.status})</option>`).join('');
        }

        function pickPdi(chassis) {
            selPdi = clean(chassis);
            const v = vehicles.find(x => clean(x.chassis) === selPdi);
            const box = document.getElementById('pdi-selected-box');
            if (!v) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';
            document.getElementById('pdi-sel-chassis').innerText = v.chassis;
            document.getElementById('pdi-sel-sub').innerText = `${v.model} • Location: ${v.location} • Status: ${v.status}`;
            if (v.status === 'HOLD' || v.status === 'REVIEW_PENDING') {
                document.getElementById('pdi-status').value = v.status;
                document.getElementById('pdi-remarks').value = v.remarks || '';
            } else {
                document.getElementById('pdi-status').value = 'PDI OK';
                document.getElementById('pdi-remarks').value = '';
            }
            toggleRemarksBox();
        }

        function quickSelectPdi(chassis) {
            openTab('pdi');
            document.getElementById('pdi-dropdown').value = chassis;
            pickPdi(chassis);
        }

        function toggleRemarksBox() {
            const st = document.getElementById('pdi-status').value;
            document.getElementById('pdi-rem-box').style.display = (st === 'HOLD' || st === 'REVIEW_PENDING') ? 'block' : 'none';
        }

        function savePdi() {
            if (!selPdi) { alert('Select a vehicle first!'); return; }
            const v = vehicles.find(x => clean(x.chassis) === selPdi);
            if (!v) return;

            const st = document.getElementById('pdi-status').value;
            const odo = clean(document.getElementById('pdi-odo').value);
            const rem = clean(document.getElementById('pdi-remarks').value);
            const insp = document.getElementById('pdi-inspector').value;

            if ((st === 'HOLD' || st === 'REVIEW_PENDING') && !rem) {
                alert('Please enter reason for Hold / Review!');
                return;
            }

            v.status = st;
            v.remarks = rem;
            v.inspector = insp;
            localStorage.setItem('luxon_cars', JSON.stringify(vehicles));

            if (config.url) {
                fetch(config.url, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'PDI_UPDATE', chassis: v.chassis, model: v.model, status: st, speed: odo, inspector: insp, location: v.location, remarks: rem })
                }).catch(() => {});
            }

            alert(`PDI updated to ${st} for ${v.chassis}`);
            selPdi = '';
            document.getElementById('pdi-selected-box').style.display = 'none';
            document.getElementById('pdi-odo').value = '';
            document.getElementById('pdi-remarks').value = '';
            openTab('dashboard');
        }

        // OPERATIONS
        function updateOpDropdown() {
            const drop = document.getElementById('op-dropdown');
            const phys = vehicles.filter(v => isPhysical(v));
            drop.innerHTML = `<option value="">-- Choose Physical Stock Vehicle (${phys.length} available) --</option>` +
                phys.map(v => `<option value="${v.chassis}" ${v.chassis===selOp?'selected':''}>${v.chassis} - ${v.model} (${v.location})</option>`).join('');
        }

        function pickOp(chassis) {
            selOp = clean(chassis);
            const v = vehicles.find(x => clean(x.chassis) === selOp);
            const box = document.getElementById('op-selected-box');
            if (!v) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';
            document.getElementById('op-sel-chassis').innerText = v.chassis;
            document.getElementById('op-sel-sub').innerText = `${v.model} • Location: ${v.location}`;
            if (LOCATIONS.includes(v.location)) document.getElementById('op-newloc').value = v.location;
        }

        function toggleOpUI() {
            const act = document.getElementById('op-action').value;
            document.getElementById('op-box-loc').style.display = act === 'LOCATION' ? 'block' : 'none';
            document.getElementById('op-box-dest').style.display = act === 'DISPATCH' ? 'block' : 'none';
            document.getElementById('op-box-region').style.display = act === 'TRANSFER' ? 'block' : 'none';
        }

        function saveOp() {
            if (!selOp) { alert('Select a vehicle first!'); return; }
            const v = vehicles.find(x => clean(x.chassis) === selOp);
            if (!v) return;

            const act = document.getElementById('op-action').value;

            if (act === 'LOCATION') {
                const nl = document.getElementById('op-newloc').value;
                v.location = nl;
                if (config.url) {
                    fetch(config.url, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'LOCATION_HOLD_UPDATE', chassis: v.chassis, model: v.model, location: nl, status: v.status, remarks: v.remarks })
                    }).catch(() => {});
                }
                alert(`Location updated to ${nl}`);
            } else if (act === 'DISPATCH') {
                const dest = document.getElementById('op-dest').value;
                v.status = 'Outward';
                v.location = 'Outward -> ' + dest;
                if (config.url) {
                    fetch(config.url, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'OUTWARD', chassis: v.chassis, model: v.model, location: v.location, status: 'Outward', outwardDest: dest })
                    }).catch(() => {});
                }
                alert(`Dispatched to ${dest}`);
            } else if (act === 'TRANSFER') {
                const reg = document.getElementById('op-region').value;
                v.status = 'Stock Transfer';
                v.location = 'Transferred -> ' + reg;
                v.remarks = 'Stock Transfer to ' + reg;
                if (config.url) {
                    fetch(config.url, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'OPERATIONS_UPDATE', chassis: v.chassis, model: v.model, location: v.location, status: 'Stock Transfer', remarks: v.remarks })
                    }).catch(() => {});
                }
                alert(`Transferred to ${reg}`);
            }

            localStorage.setItem('luxon_cars', JSON.stringify(vehicles));
            selOp = '';
            document.getElementById('op-selected-box').style.display = 'none';
            openTab('dashboard');
        }

        // INWARD
        function saveInward() {
            const ch = clean(document.getElementById('in-chassis').value).toUpperCase();
            const md = clean(document.getElementById('in-model').value);
            const lc = document.getElementById('in-location').value;

            if (!ch || !md) { alert('Enter Chassis and Model!'); return; }

            const ex = vehicles.find(x => clean(x.chassis).toUpperCase() === ch);
            if (ex && isPhysical(ex)) {
                alert(`Chassis already in Physical Stock at ${ex.location}!`);
                return;
            }

            const rec = { chassis: ch, model: md, location: lc, status: 'Pending PDI', remarks: '', inspector: '' };
            if (ex) {
                Object.assign(ex, rec);
            } else {
                vehicles.unshift(rec);
            }
            localStorage.setItem('luxon_cars', JSON.stringify(vehicles));

            if (config.url) {
                fetch(config.url, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'INWARD', chassis: ch, model: md, location: lc, status: 'Pending PDI' })
                }).catch(() => {});
            }

            document.getElementById('in-chassis').value = '';
            document.getElementById('in-model').value = '';
            alert(`Inward saved for ${ch}`);
            openTab('dashboard');
        }

        function downloadCSV() {
            let csv = "Chassis,Model,Location,Status,Remarks\n";
            vehicles.forEach(v => {
                csv += `"${v.chassis}","${v.model}","${v.location}","${v.status}","${v.remarks || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Stock_Report.csv`;
            a.click();
        }

        function openSettingsModal() {
            document.getElementById('cfg-url').value = config.url;
            document.getElementById('settings-modal').style.display = 'flex';
        }
        function closeModals() {
            document.getElementById('settings-modal').style.display = 'none';
        }
        function saveConfig() {
            config.url = clean(document.getElementById('cfg-url').value);
            localStorage.setItem('luxon_cfg', JSON.stringify(config));
            closeModals();
            syncSheet();
        }
    </script>
</body>
</html>
